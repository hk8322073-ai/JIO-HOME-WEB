<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JIO HOME WEB — Page not found</title>
    <link rel="stylesheet" href="/public/CSS/global.css" />
    <link rel="stylesheet" href="/public/CSS/404.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <div class="brand-badge">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"
            />
          </svg>
        </div>
        <span class="brand-name">JIO HOME WEB</span>
      </div>
      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="Toggle dark mode"
        onclick="toggleTheme()"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
          />
        </svg>
      </button>
    </div>

    <main>
      <div class="content">
        <div class="orbit">
          <div class="pulse"></div>
          <div class="pulse p2"></div>
          <div class="pulse p3"></div>
          <div class="ring"></div>
          <div class="ring r2"></div>

          <div class="hub">
            <div class="hub-inner">
              <svg
                width="34"
                height="34"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1.42 9a16 16 0 0 1 21.16 0" />
                <path d="M5 12.55a11 11 0 0 1 14.08 0" />
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
                <line x1="11.5" y1="19.5" x2="11.5" y2="19.51" />
                <line x1="3" y1="3" x2="21" y2="21" />
              </svg>
            </div>
          </div>

          <div class="chip c1">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="5" y="2" width="14" height="20" rx="2" />
              <line x1="12" y1="18" x2="12.01" y2="18" />
            </svg>
          </div>
          <div class="chip c2">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="14" width="20" height="8" rx="2" />
              <line x1="6" y1="18" x2="6.01" y2="18" />
              <line x1="10" y1="18" x2="10.01" y2="18" />
            </svg>
          </div>
          <div class="chip c3">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" />
            </svg>
          </div>
          <div class="chip c4">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </div>
        </div>

        <p class="code">ERROR 404</p>
        <h1>This page has gone off the network</h1>
        <p class="subtitle">
          The page you're looking for doesn't exist or has been moved.
        </p>

        <div class="actions">
          <a href="/login" class="btn btn-primary">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"
              />
            </svg>
            Back to sign in
          </a>
          <button class="btn btn-secondary" id="goBackBtn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Go back
          </button>
        </div>

        <div class="help-row">
          <span>Still stuck?</span>
          <a href="mailto:support@example.com">Contact support</a>
        </div>
      </div>
    </main>

    <footer>
      &copy; <span id="year"></span> JIO HOME WEB. All rights reserved.
    </footer>
    <script src="/public/JS/global.js"></script>
    <script>
      document.getElementById("goBackBtn").addEventListener("click", () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = "/";
      });
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
